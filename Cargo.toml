[package]
name = "agentics"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Synchronize agentic resources across coding-agent harnesses"
repository = "https://github.com/rymccue/agentics"
readme = "README.md"
keywords = ["cli", "agents", "ai", "sync"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
sha2 = "0.10"
thiserror = "2.0"
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
